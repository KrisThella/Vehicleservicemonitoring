[package]
name = "vehicleservicemonitoring"
version = "0.0.1"
description = "Vehicle Service Monitoring desktop app"
authors = ["KrisThella"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1" }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1" }
