[package]
name = "vehicleservicemonitoring"
version = "0.0.1"
description = "Vehicle Service Monitoring desktop app"
authors = ["KrisThella"]
edition = "2021"
build = "build.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = [] }
log = "0.4"
tauri-plugin-log = "2"
dirs = "4"
